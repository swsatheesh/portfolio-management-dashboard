services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: portfolio_api_dev
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      DATABASE_TYPE: sqlite
      DATABASE_PATH: /app/data/dev.sqlite
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - api_data:/app/data
    command: pnpm dev

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: portfolio_web_dev
    ports:
      - "5173:5173"
    env_file:
      - ./.env
    environment:
      VITE_API_BASE_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: pnpm dev --host 0.0.0.0

volumes:
  api_data: